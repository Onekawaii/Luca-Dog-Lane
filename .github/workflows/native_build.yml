name: Hive-Lattice Native Build

on:
  push:
    branches: [main, feat/fps-world-interactions]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hive-lattice-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Native Deliverables
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Pillow

      - name: Install Godot 4.3 Engine & Export Templates
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/4.3.stable
          echo "Downloading Godot 4.3 stable Linux binary..."
          curl -sSL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          sudo cp /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot 4.3 export templates..."
          curl -sSL -o /tmp/godot/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/godot/templates.tpz -d /tmp/godot/templates_raw
          cp -r /tmp/godot/templates_raw/templates/* ~/.local/share/godot/export_templates/4.3.stable/

          godot --version

      - name: Generate Visual Assets & Export Campaign Data
        run: |
          python tools/export_godot_campaign.py
          python tools/generate_godot_assets.py

      - name: Import Godot Project & Build Asset Cache
        run: |
          godot --headless --path game_godot --import

      - name: Run Full Stack Contract & Native Headless Verification
        run: |
          python tools/verify_native_contract.py

      - name: Export Windows Desktop Binary
        run: |
          mkdir -p dist/windows
          godot --headless --path game_godot --export-release "Windows Desktop" ../dist/windows/Hive-Lattice.exe

      - name: Build & Sign Android APK
        run: |
          python tools/build_android_apk.py

      - name: Package Native Deliverables & Compute Checksums
        run: |
          python tools/package_native_playtest.py
          python tools/package_termux_bundle.py

      - name: Validate Deliverable Integrity
        run: |
          echo "Verifying generated deliverables..."
          ls -la dist/
          test -s dist/Hive-Lattice-native-windows-playtest.zip
          test -s dist/Hive-Lattice-native-windows-playtest.zip.sha256
          test -s dist/Hive-Lattice-native-android-playtest.apk
          test -s dist/Hive-Lattice-native-android-playtest.apk.sha256
          test -s dist/Hive-Lattice-native-playtest-source.zip
          test -s dist/Hive-Lattice-native-playtest-source.zip.sha256
          test -s outputs/Hive-Lattice-v0.7.0-visual-slice.zip
          test -s outputs/Hive-Lattice-v0.7.0-visual-slice.zip.sha256
          echo "[OK] All deliverables validated."

      - name: Write Continuous Build Receipt
        run: |
          {
            echo "# Hive-Lattice Continuous Build Receipt"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Godot: \`4.3.stable.official.77dcf97d8\`"
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Checksums"
            echo '```text'
            cat dist/Hive-Lattice-native-windows-playtest.zip.sha256
            cat dist/Hive-Lattice-native-android-playtest.apk.sha256
            cat dist/Hive-Lattice-native-playtest-source.zip.sha256
            cat outputs/Hive-Lattice-v0.7.0-visual-slice.zip.sha256
            echo '```'
          } > dist/CONTINUOUS_BUILD_RECEIPT.md
          cat dist/CONTINUOUS_BUILD_RECEIPT.md

      - name: Publish Continuous Playtest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="hive-lattice-continuous"
          TITLE="Hive-Lattice Continuous Playtest"
          NOTES="Automated native playtest build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. This prerelease is replaced as the branch advances."

          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi

          gh release upload "$TAG" --clobber \
            dist/Hive-Lattice-native-windows-playtest.zip \
            dist/Hive-Lattice-native-windows-playtest.zip.sha256 \
            dist/Hive-Lattice-native-android-playtest.apk \
            dist/Hive-Lattice-native-android-playtest.apk.sha256 \
            dist/Hive-Lattice-native-playtest-source.zip \
            dist/Hive-Lattice-native-playtest-source.zip.sha256 \
            outputs/Hive-Lattice-v0.7.0-visual-slice.zip \
            outputs/Hive-Lattice-v0.7.0-visual-slice.zip.sha256 \
            dist/CONTINUOUS_BUILD_RECEIPT.md

  verify-android:
    name: Verify Android Boot on Emulator
    needs: build
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Android Deliverable From Continuous Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download hive-lattice-continuous \
            --pattern 'Hive-Lattice-native-android-playtest.apk' \
            --dir dist \
            --clobber
          test -s dist/Hive-Lattice-native-android-playtest.apk

      - name: Execute Android Emulator Boot Verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python tools/verify_android_boot.py

      - name: Publish Android Boot Diagnostics To Continuous Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for candidate in \
            dist/android_boot_logcat.txt \
            dist/android_boot_screenshot.png \
            dist/android_crash_logcat.txt; do
            if [ -s "$candidate" ]; then
              files+=("$candidate")
            fi
          done
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload hive-lattice-continuous --clobber "${files[@]}"
          else
            echo "No diagnostics files were produced."
          fi
