name: Hive-Lattice Test Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate campaign
        run: |
          python tools/content_lint.py
          python -m tools.validate_campaign_module
          python -m tools.validate_visual_assets
          python -m hive_lattice.cli validate strawberry_omen
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: JavaScript syntax
        run: |
          node --check hive_lattice/web_app/static/strawberry.js
          node --check hive_lattice/web_app/static/world_client.js
      - name: Package Termux playtest
        run: python tools/package_termux_bundle.py
      - name: Upload Termux playtest
        uses: actions/upload-artifact@v4
        with:
          name: Hive-Lattice-Termux-playtest
          path: |
            outputs/Hive-Lattice-v0.7.0-visual-slice.zip
            outputs/Hive-Lattice-v0.7.0-visual-slice.zip.sha256
          if-no-files-found: error
          retention-days: 14
