name: Materialize v0.7 World in Motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-v070-world-in-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified v0.7 patch
        env:
          PATCH_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0918-81f5-88b0-6f2d54c01778/raw?se=2026-09-06T04%3A08%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=9d3bb70c-e587-5b8f-bba8-e673ac2de14c&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T15%3A17%3A41Z&ske=2026-09-06T15%3A17%3A41Z&sks=b&skv=2026-02-06&sig=/tJ1o5HM5Nt5G2fIllMD2AD7Y2ko2y4SszhBKWBpKuU%3D'
        run: |
          curl --fail --location --retry 3 "$PATCH_URL" --output /tmp/v070_patch.txt
          test "$(wc -c < /tmp/v070_patch.txt)" -eq 56328
          base64 -d /tmp/v070_patch.txt > /tmp/v070_patch.tar.xz
          echo "bd62db772ccc689f96feaa7bff00d85e949dbe565e63d4ce0b0a9ff7454c950d  /tmp/v070_patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v070_patch.tar.xz -C .
          rm -f .github/workflows/materialize-v070-world-in-motion.yml
          rm -f .github/workflows/test.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate campaign
        run: |
          python tools/content_lint.py
          python -m tools.validate_campaign_module
          python -m tools.validate_visual_assets
          python -m hive_lattice.cli validate strawberry_omen

      - name: Full Python test suite
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: JavaScript syntax
        run: |
          node --check hive_lattice/web_app/static/strawberry.js
          node --check hive_lattice/web_app/static/world_client.js

      - name: Commit verified world-in-motion slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: world in motion vertical slice'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report final SHA
        run: echo "World in Motion main is $FINAL_SHA"
