name: Hive-Lattice Native PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "game_godot/**"
      - "campaigns/strawberry_omen/**"
      - "hive_lattice/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/native_pr_check.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Native Contract & First-Person Headless Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Pillow

      - name: Install Godot 4.3
        run: |
          mkdir -p /tmp/godot
          curl -sSL -o /tmp/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          sudo cp /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Refresh Generated Native Inputs
        run: |
          python tools/export_godot_campaign.py
          python tools/generate_godot_assets.py

      - name: Import Godot Project & Build Asset Cache
        run: |
          godot --headless --path game_godot --import

      - name: Run Full Native Contract Verification
        run: python tools/verify_native_contract.py
